steps:
  # 0. Pull the previous image to use as a cache for faster builds
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker pull gcr.io/trello-clone-492816/trello-clone:latest || exit 0']

  # 1. Build the container image using the cached layers
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/trello-clone-492816/trello-clone:latest', 
      '--build-arg', 'BUILDKIT_INLINE_CACHE=1',
      '--cache-from', 'gcr.io/trello-clone-492816/trello-clone:latest',
      '.'
    ]
    env:
      - 'DOCKER_BUILDKIT=1'

  # 2. Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/trello-clone-492816/trello-clone:latest']

  # 3. Run Prisma db push to sync schema BEFORE deploying new code
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npm install prisma@latest --no-save && npx prisma db push --url="$$DATABASE_URL" --accept-data-loss'
    secretEnv: ['DATABASE_URL']

  # 4. Deploy to Cloud Run (US Central)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trello-clone-us'
      - '--image'
      - 'gcr.io/trello-clone-492816/trello-clone:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets=DATABASE_URL=DATABASE_URL_US:latest,GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest,DROPBOX_APP_KEY=DROPBOX_APP_KEY:latest,DROPBOX_APP_SECRET=DROPBOX_APP_SECRET:latest,DROPBOX_REFRESH_TOKEN=DROPBOX_REFRESH_TOKEN:latest,GOOGLE_DRIVE_API_KEY=GOOGLE_DRIVE_API_KEY:latest'
      - '--set-env-vars=COMFYUI_API_URL=https://unbitten-uncontemptuously-aimee.ngrok-free.dev'

  # 5. Deploy to Cloud Run (Europe West)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trello-clone-eu'
      - '--image'
      - 'gcr.io/trello-clone-492816/trello-clone:latest'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets=DATABASE_URL=DATABASE_URL_US:latest,GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest,DROPBOX_APP_KEY=DROPBOX_APP_KEY:latest,DROPBOX_APP_SECRET=DROPBOX_APP_SECRET:latest,DROPBOX_REFRESH_TOKEN=DROPBOX_REFRESH_TOKEN:latest,GOOGLE_DRIVE_API_KEY=GOOGLE_DRIVE_API_KEY:latest'
      - '--set-env-vars=COMFYUI_API_URL=https://unbitten-uncontemptuously-aimee.ngrok-free.dev'

images:
  - 'gcr.io/trello-clone-492816/trello-clone:latest'

availableSecrets:
  secretManager:
    - versionName: projects/trello-clone-492816/secrets/DATABASE_URL_US/versions/latest
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
